name: Euro Flutuante APK
on:
  push:
    branches: [euro-flutuante-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: euroflutuante
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EuroFlutuante-APK
          path: euroflutuante/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to branch for direct download
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/EuroFlutuante-v1.0.apk
          cd ..
          git fetch origin euro-flutuante-build
          git checkout -B euro-flutuante-build origin/euro-flutuante-build
          mkdir -p downloads
          cp /tmp/EuroFlutuante-v1.0.apk downloads/EuroFlutuante-v1.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/EuroFlutuante-v1.0.apk
          git commit -m "Publish Euro Flutuante APK [skip ci]" || exit 0
          git push origin HEAD:euro-flutuante-build
