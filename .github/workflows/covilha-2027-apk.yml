name: Covilha 2027 APK
on:
  push:
    branches: [covilha-2027-app]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: covilha2027
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Covilha2027-APK
          path: covilha2027/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Covilha2027-v1.0.apk
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin covilha-2027-app
          git checkout -B covilha-2027-app origin/covilha-2027-app
          mkdir -p downloads
          cp /tmp/Covilha2027-v1.0.apk downloads/Covilha2027-v1.0.apk
          git add downloads/Covilha2027-v1.0.apk
          git commit -m "Publish Covilha 2027 APK [skip ci]" || exit 0
          git push origin HEAD:covilha-2027-app
